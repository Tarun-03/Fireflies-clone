[project]
name = "meeting-workspace-backend"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "openai==3.24.0",
    "pydantic-settings==2.15.0",
    "reportlab==5.0.1",
    "sqlalchemy==2.1.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "types-reportlab==5.0.0.20261006",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
