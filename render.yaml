services:
  - type: web
    name: meeting-workspace-api
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: LLM_PROVIDER
        value: disabled
      - key: MAX_WORKSPACES
        value: '500'
      - key: GLOBAL_TEXT_BYTES
        value: '536870912'
