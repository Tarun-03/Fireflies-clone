services:
  - type: web
    name: meeting-workspace-api
    runtime: docker
    plan: starter
    region: singapore
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 40
    disk:
      name: meeting-workspace-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/meeting-workspace.db
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: LLM_PROVIDER
        value: disabled
      - key: MAX_WORKSPACES
        value: '500'
      - key: GLOBAL_TEXT_BYTES
        value: '536870912'
      - key: DISK_RESERVE_BYTES
        value: '104857600'
